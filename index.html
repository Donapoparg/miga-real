            renderApp();
        };

        window.clearOrder = () => {
            state.order = {};
            state.orderError = '';
            saveStateToSession();
            renderApp();
        };

        window.toggleMobileMenu = (force) => {
            state.mobileMenuOpen = typeof force === 'boolean' ? force : !state.mobileMenuOpen;
            renderApp();
        };

        window.openReferralModal = () => {
            state.referralModalOpen = true;
            state.referralError = '';
            renderApp();
        };

        window.closeReferralModal = () => {
            state.referralModalOpen = false;
            state.referralError = '';
            renderApp();
        };

        window.toggleProductSpec = (id) => {
            state.openSpecId = state.openSpecId === id ? null : id;
            renderApp();
        };

        window.toggleFaq = (idx) => {
            state.openFaqIndex = state.openFaqIndex === idx ? null : idx;
            renderApp();
        };

        window.updateCalculator = (field, val) => {
            let num = parseInt(val, 10) || 0;
            if (field === 'packCount') {
                if (num < 16) num = 16;
                num = Math.round(num / 4) * 4;
            }
            state[field] = num;
            renderApp();
        };

        window.updateQty = (productName, delta) => {
            const current = state.order[productName] || 0;
            const next = Math.max(0, current + delta);
            if (next === 0) {
                delete state.order[productName];
            } else {
                state.order[productName] = next;
            }
            state.orderError = '';
            saveStateToSession();
            renderApp();
        };

        window.updateFormField = (name, value, shouldRender = false) => {
            state.formData[name] = value;
            saveStateToSession();
            if (shouldRender) renderApp();
        };

        window.toggleRecurringDay = (dia) => {
            const actuales = state.formData.diasRecurrentes || [];
            state.formData.diasRecurrentes = actuales.includes(dia)
                ? actuales.filter(d => d !== dia)
                : [...actuales, dia];
            state.daysError = false;
            saveStateToSession();
            renderApp();
        };

        window.submitReferralForm = async (e) => {
            e.preventDefault();
            const form = e.target;
            const tuNombre = form.tuNombre.value.trim();
            const tuWhatsapp = form.tuWhatsapp.value.trim();
            const tuAlias = form.tuAlias.value.trim();
            const comercioReferido = form.comercioReferido.value.trim();
            const direccionReferido = form.direccionReferido.value.trim();
            const contactoReferido = form.contactoReferido.value.trim();

            // Validación anti-autorreferido: impide poner el mismo teléfono o nombre
            if (normalizePhone(tuWhatsapp) && normalizePhone(tuWhatsapp) === normalizePhone(contactoReferido)) {
                state.referralError = "El teléfono del comercio recomendado no puede coincidir con tu propio número de WhatsApp (no se admiten autorreferidos).";
                renderApp();
                return;
            }

            if (tuNombre.toLowerCase() === comercioReferido.toLowerCase()) {
                state.referralError = "El nombre del comercio recomendado debe ser distinto al tuyo.";
                renderApp();
                return;
            }

            const token = generateSecureToken('REF');
            const fecha = new Date().toLocaleString('es-AR');

            await sendToAuditWebhook('referral_preregister', {
                token,
                fecha,
                tuNombre,
                tuWhatsapp,
                tuAlias,
                comercioReferido,
                direccionReferido,
                contactoReferido
            });

            const msg = `🔒 *PRE-REGISTRO DE REFERIDO ($10.000)*\n` +
                `*ID de Auditoría:* ${token}\n` +
                `*Fecha y Hora:* ${fecha}\n\n` +
                `👤 *DATOS DEL REFERIDOR (Quien cobra):*\n` +
                `- Nombre/Comercio: ${tuNombre}\n` +
                `- WhatsApp: ${tuWhatsapp}\n` +
                `- Alias/CBU: ${tuAlias}\n\n` +
                `🏪 *NUEVO COMERCIO RECOMENDADO:*\n` +
                `- Comercio: ${comercioReferido}\n` +
                `- Dirección Exacta: ${direccionReferido}\n` +
                `- WhatsApp Titular/Encargado: ${contactoReferido}\n\n` +
                `✅ *Condición unificada aceptada:* El premio de $10.000 se liquida cuando el comercio referido reciba y abone su 2° pedido mayorista regular (1° y 2° pedido de mínimo 16 envases c/u). Declaro contar con autorización del titular para compartir su contacto.`;

            state.referralModalOpen = false;
            renderApp();
            openWhatsApp(getWaLink(msg), 'referral_submit');
        };

        window.submitOrderForm = async (e) => {
            e.preventDefault();
            const minPacks = state.formData.tipoPedido === 'prueba' ? 8 : 16;
            const totalPacks = Object.values(state.order).reduce((a, b) => a + b, 0);

            if (totalPacks < minPacks) {
                state.orderError = `Para la modalidad seleccionada (${state.formData.tipoPedido === 'prueba' ? 'Pack de Prueba de 8 envases' : 'Pedido Mayorista Regular de 16 envases'}), te faltan ${minPacks - totalPacks} envases.`;
                renderApp();
                return;
            }

            if (state.formData.recurrente === 'si' && (!state.formData.diasRecurrentes || state.formData.diasRecurrentes.length === 0)) {
                state.daysError = true;
                renderApp();
                return;
            }

            // Bloqueo de autorreferido en comanda
            if (state.formData.refTelefono && normalizePhone(state.formData.refTelefono) === normalizePhone(state.formData.whatsapp)) {
                state.orderError = "El teléfono del referidor no puede ser el mismo que el WhatsApp de tu comercio.";
                renderApp();
                return;
            }

            const orderToken = generateSecureToken('PED');
            const totalAmount = totalPacks * WHOLESALE_PRICE;
            let orderLines = "";
            for (const [prod, qty] of Object.entries(state.order)) {
                orderLines += `- ${qty} envases (${qty * 2} sándw.) de ${prod}\n`;
            }

            const dias = state.formData.diasRecurrentes || [];
            const subText = state.formData.recurrente === 'si'
                ? `\n🔄 *Suscripción Recurrente:* Sí\n📅 *Días elegidos:* ${dias.join(', ')}\n🕒 *Franja horaria:* ${state.formData.franjaHoraria}`
                : `\n🔄 *Frecuencia:* Pedido Único`;

            const refText = (state.formData.refNombre || state.formData.refTelefono)
                ? `\n🤝 *Referido por:* ${state.formData.refNombre || 'No especificado'} (Tel: ${state.formData.refTelefono || 'No especificado'})`
                : '';

            await sendToAuditWebhook('wholesale_order', {
                orderToken,
                modalidad: state.formData.tipoPedido,
                totalPacks,
                totalAmount,
                order: state.order,
                formData: state.formData
            });

            const message = `¡Hola Miga Real! 👋\n\n` +
                `Quiero confirmar el siguiente pedido (${state.formData.tipoPedido === 'prueba' ? 'PACK 1° PEDIDO DE PRUEBA' : 'MAYORISTA REGULAR'}):\n` +
                `*Código de Comanda:* ${orderToken}\n\n` +
                `🛒 *DETALLE DEL PEDIDO*\n${orderLines}\n` +
                `*Total Envases:* ${totalPacks} envases (${totalPacks * 2} sándwiches)\n` +
                `*Total Estimado (precios al ${PRICE_VALID_UNTIL}):* $${totalAmount.toLocaleString('es-AR')}\n` +
                `*Medio de Pago:* ${state.formData.medioPago}${subText}${refText}\n\n` +
                `🏪 *DATOS DE RECEPCIÓN*\n` +
                `*Comercio:* ${state.formData.nombreComercio}\n` +
                `*WhatsApp:* ${state.formData.whatsapp}\n` +
                `*Localidad:* ${state.formData.localidad}\n` +
                `*Dirección:* ${state.formData.direccion}\n` +
                `*Horario de atención:* ${state.formData.horario}\n\n` +
                `Aguardo confirmación de reparto. ¡Gracias!`;

            openWhatsApp(getWaLink(message), 'order_submit');
        };

        // Navegación por hash y cierre de modal con Escape
        window.addEventListener('hashchange', () => {
            state.currentView = ROUTES[window.location.hash] || 'landing';
            state.mobileMenuOpen = false;
            renderApp();
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && state.referralModalOpen) {
                window.closeReferralModal();
            }
        });

        // Render inicial inmediato
        renderApp();
    </script>
</body>
</html>
