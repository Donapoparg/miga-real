                                            </div>
                                            
                                            <ProductImageUploader productName={prod.name} defaultImage={null} />

                                            <h3 className="text-xl sm:text-2xl font-bold text-white mb-2.5 group-hover:text-amber-400 transition-colors">{prod.name}</h3>
                                            <p className="text-slate-400 leading-relaxed text-xs sm:text-sm mb-6">{prod.desc}</p>
                                        </div>
                                        <div className="pt-4 border-t border-slate-800/80 flex items-center justify-between text-xs">
                                            <span className="font-medium text-slate-500">Presentación en Envase</span>
                                            <span className={`${prod.available ? 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20' : 'text-slate-400 bg-slate-800 border-slate-700'} font-bold px-3 py-1 rounded-md border`}>{prod.available ? 'Alta Rotación' : 'Próximamente'}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    <section id="rentabilidad" className="py-16 sm:py-24 bg-slate-950 text-white font-poppins relative overflow-hidden border-t border-slate-800">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
                            <div className="text-center mb-12 sm:mb-16 max-w-2xl mx-auto">
                                <span className="text-amber-400 font-bold tracking-wider uppercase text-xs bg-amber-500/10 px-3.5 py-1.5 rounded-full border border-amber-500/20">Calculadora Mayorista</span>
                                <h2 className="text-2xl sm:text-3xl md:text-5xl font-extrabold text-white mt-4 tracking-tight">Proyectá Tu Ganancia Neta</h2>
                                <p className="text-slate-400 mt-3 text-sm sm:text-base">Calculá cuánto podés ganar sumando sándwiches Miga Real en tu mostrador.</p>
                            </div>

                            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12 items-center bg-slate-900/80 backdrop-blur-md p-6 sm:p-10 md:p-12 rounded-3xl border border-slate-800 shadow-2xl">
                                <div className="lg:col-span-6 space-y-6 sm:space-y-8">
                                    <div>
                                        <label className="block text-xs sm:text-sm font-bold text-slate-200 mb-3 flex items-center justify-between">
                                            <span>Sándwiches estimados vendidos por semana:</span>
                                            <span className="text-amber-400 font-extrabold text-base sm:text-xl">{packCount} unidades</span>
                                        </label>
                                        <input 
                                            type="range" 
                                            min="16" 
                                            max="100" 
                                            step="4" 
                                            value={packCount} 
                                            onChange={handleSliderChange} 
                                            className="w-full accent-amber-500 h-2 bg-slate-950 rounded-lg cursor-pointer"
                                        />
                                        <div className="flex justify-between text-[11px] sm:text-xs text-slate-400 mt-2 font-medium">
                                            <span>16 un. [Mínimo]</span>
                                            <span>50 un. (Medio)</span>
                                            <span>100 un. (Alto)</span>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4 pt-4 border-t border-slate-800">
                                        <div className="bg-slate-950 p-4 sm:p-5 rounded-2xl border border-slate-800 shadow-inner">
                                            <p className="text-[11px] sm:text-xs text-slate-400 font-medium mb-1">Costo Mayorista ($2.000 c/u)</p>
                                            <p className="text-lg sm:text-xl font-bold text-slate-100">${totalInvestment.toLocaleString('es-AR')}</p>
                                        </div>
                                        <div className="bg-slate-950 p-4 sm:p-5 rounded-2xl border border-slate-800 shadow-inner">
                                            <p className="text-[11px] sm:text-xs text-slate-400 font-medium mb-1">Venta al Público ($3.500 c/u)</p>
                                            <p className="text-lg sm:text-xl font-bold text-amber-400">${totalRevenue.toLocaleString('es-AR')}</p>
                                        </div>
                                    </div>
                                </div>

                                <div className="lg:col-span-6 bg-gradient-to-br from-amber-600 to-orange-700 p-8 sm:p-10 md:p-12 rounded-3xl text-white shadow-xl flex flex-col justify-between text-center border border-amber-500/30">
                                    <div>
                                        <span className="inline-block px-4 py-1.5 bg-black/20 text-white rounded-full text-xs font-bold uppercase tracking-wider mb-4 shadow-sm">Ganancia Semanal Estimada</span>
                                        <div className="text-4xl sm:text-5xl md:text-6xl font-extrabold text-white tracking-tight mb-3">${totalProfit.toLocaleString('es-AR')}</div>
                                        <p className="text-amber-100 text-xs sm:text-sm font-medium">Margen neto excelente para productos de alta rotación en mostrador.</p>
                                    </div>
                                    <div className="mt-8">
                                        <button onClick={onNavigateToRegister} className="w-full bg-slate-950 text-white font-extrabold py-4 rounded-2xl shadow-lg hover:bg-slate-900 transition-all active:scale-95 flex items-center justify-center gap-2.5 text-base">
                                            <FileText className="w-5 h-5" /> Realizar Pedido
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section id="faq" className="py-16 sm:py-24 bg-slate-900 font-poppins border-t border-slate-800">
                        <div className="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="text-center mb-12 sm:mb-16">
                                <span className="text-emerald-400 font-bold tracking-wider uppercase text-xs bg-emerald-500/10 px-3.5 py-1.5 rounded-full border border-emerald-500/20">Resolvé tus dudas</span>
                                <h2 className="text-2xl sm:text-3xl md:text-4xl font-extrabold text-white mt-4">Preguntas Frecuentes</h2>
                            </div>
                            <div className="space-y-4">
                                {DATA.faqItems.map((item, i) => (
                                    <div 
                                        key={i}
                                        className={`bg-slate-950 rounded-2xl border transition-all duration-200 cursor-pointer overflow-hidden shadow-md ${openFaq === i ? 'border-amber-500 ring-1 ring-amber-500' : 'border-slate-800 hover:border-slate-700'}`} 
                                        onClick={() => toggleFaq(i)}
                                    >
                                        <div className="flex justify-between items-center p-5 sm:p-6">
                                            <h3 className={`text-sm sm:text-base md:text-lg font-bold pr-3 ${openFaq === i ? 'text-amber-400' : 'text-white'}`}>{item.question}</h3>
                                            <div className={`p-1.5 rounded-full shrink-0 ${openFaq === i ? 'text-amber-400 bg-amber-500/10' : 'text-slate-400'}`}>
                                                {openFaq === i ? <ChevronUp className="w-5 h-5" /> : <ChevronDown className="w-5 h-5" />}
                                            </div>
                                        </div>
                                        <div className={`transition-all duration-200 overflow-hidden ${openFaq === i ? 'max-h-96 opacity-100' : 'max-h-0 opacity-0'}`}>
                                            <p className="px-5 sm:px-6 pb-5 sm:pb-6 text-slate-300 text-xs sm:text-sm md:text-base leading-relaxed border-t border-slate-800/60 pt-4">{item.answer}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>

                    <footer className="bg-slate-950 text-slate-300 py-12 sm:py-16 border-t border-slate-800 font-poppins text-xs sm:text-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex flex-col md:flex-row justify-between items-center gap-8 text-center md:text-left">
                                <div className="flex flex-col sm:flex-row items-center gap-4">
                                    <BrandLogo className="w-12 h-12" />
                                    <div>
                                        <span className="text-xl sm:text-2xl font-extrabold text-white">MIGA <span className="text-amber-500">REAL</span></span>
                                        <p className="text-slate-400 mt-1 text-xs">Sándwiches de miga artesanales mayoristas.</p>
                                    </div>
                                </div>
                                <div className="flex flex-col items-center md:items-end gap-3">
                                    <p className="text-slate-400 text-xs">¿Consultas o pedidos directos?</p>
                                    <a href={getSecureWaLink()} target="_blank" rel="noopener noreferrer" className="inline-flex items-center gap-2 text-white bg-green-600 hover:bg-green-700 px-6 py-3.5 rounded-full font-bold transition-colors shadow-lg text-xs sm:text-sm active:scale-95">
                                        <WhatsAppIcon className="w-4 h-4" /> Hablar por WhatsApp
                                    </a>
                                </div>
                            </div>
                            <div className="mt-10 border-t border-slate-800 pt-8 flex flex-col sm:flex-row justify-between items-center text-slate-500 text-xs gap-4">
                                <p>&copy; 2026 Miga Real. Todos los derechos reservados.</p>
                                <div className="flex gap-6">
                                    <button onClick={onNavigateToTerms} className="hover:text-amber-400 transition-colors">Términos y Condiciones</button>
                                    <button onClick={onNavigateToPrivacy} className="hover:text-amber-400 transition-colors">Política de Privacidad</button>
                                </div>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const App = () => {
            const [currentView, setCurrentView] = useState('landing');

            return (
                <div className="min-h-screen bg-slate-900 text-slate-100 font-poppins">
                    <GlobalStyles />
                    {currentView === 'landing' && (
                        <LandingPage 
                            onNavigateToRegister={() => setCurrentView('register')}
                            onNavigateToTerms={() => setCurrentView('terms')}
                            onNavigateToPrivacy={() => setCurrentView('privacy')}
                        />
                    )}
                    {currentView === 'register' && (
                        <CommerceForm onBack={() => setCurrentView('landing')} />
                    )}
                    {currentView === 'terms' && (
                        <TermsPage onBack={() => setCurrentView('landing')} />
                    )}
                    {currentView === 'privacy' && (
                        <PrivacyPage onBack={() => setCurrentView('landing')} />
                    )}
                </div>
            );
        };

        createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
